# إعدادات Firebase App Hosting.
# لا تُوضع القيم هنا — تُقرأ من Secret Manager أو من إعدادات المشروع.
# للنشر:  firebase apphosting:backends:create --project <PROJECT_ID>
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
  # الاستخراج قد يستغرق دقيقة على مستند ممسوح كبير
  timeoutSeconds: 300

env:
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability: [BUILD, RUNTIME]
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability: [RUNTIME]
  - variable: AUTH_URL
    value: https://REPLACE-ME.web.app
    availability: [RUNTIME]
  - variable: GOOGLE_CLIENT_ID
    secret: GOOGLE_CLIENT_ID
    availability: [RUNTIME]
  - variable: GOOGLE_CLIENT_SECRET
    secret: GOOGLE_CLIENT_SECRET
    availability: [RUNTIME]
  - variable: ALLOWED_EMAILS
    secret: ALLOWED_EMAILS
    availability: [RUNTIME]
  - variable: EXTRACTION_PROVIDER
    value: gemini
    availability: [RUNTIME]
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability: [RUNTIME]
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability: [RUNTIME]
  - variable: DRIVE_ACCOUNTS_FOLDER_ID
    value: 1YCpJT2Qu4Ayvh2ZwCwcu1KA3qmDx_eor
    availability: [RUNTIME]
  - variable: DRIVE_YEAR_2026_FOLDER_ID
    value: 1N8Lp4xxpHWuLgA1LWKpSe9Ox3GhAsEMl
    availability: [RUNTIME]
  - variable: DRIVE_YEAR_2027_FOLDER_ID
    value: 1mG_zGvM8bljFyStmijGeY5cb9zeo-4Bq
    availability: [RUNTIME]
  - variable: COMPANY_NAME_AR
    value: مؤسسة ذا بوبليك هاوس
    availability: [RUNTIME]
  - variable: COMPANY_VAT_NUMBER
    value: "310007971600003"
    availability: [RUNTIME]
  - variable: COMPANY_CR_NUMBER
    value: "7052766941"
    availability: [RUNTIME]
