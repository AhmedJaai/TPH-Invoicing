name: فحص الجودة

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: فحص الأسلوب
        run: npm run lint

      - name: لا صادرَ ميّتاً
        run: npm run lint:dead

      - name: اختبارات منطق الأعمال
        run: npm test

      # البناء يحتاج متغيرات وهمية فقط — لا يتصل بقاعدة بيانات حقيقية
      - name: البناء
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: ci-placeholder-secret-value-not-real
          COMPANY_VAT_NUMBER: "310007971600003"
          DRIVE_ACCOUNTS_FOLDER_ID: placeholder
          DRIVE_YEAR_2026_FOLDER_ID: placeholder
          DRIVE_YEAR_2027_FOLDER_ID: placeholder

  # الاختبارات النقيّة لا تُثبت أنّ النظام يعمل — هذه تلمس قاعدة
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tph_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tph_ci_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tph_ci_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # الأوامر تُشغَّل بـ --env-file=.env، وNode 20 يسقط إن غاب الملفّ — والقيم من env أعلاه
      - run: touch .env

      - name: تأسيس المخطّط (baseline.sql ثمّ الهجرات اللاحقة)
        run: npm run db:bootstrap

      - name: تجهيز ما يحتاجه فحص القيود
        run: npm run db:test-fixture

      - name: القاعدة ترفض ما يجب رفضه
        run: npm run db:verify -- --require-data

      - name: اختبارات الخدمات على القاعدة
        run: npm run test:db
