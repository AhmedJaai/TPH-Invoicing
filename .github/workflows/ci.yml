name: فحص الجودة

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: فحص الأسلوب
        run: npm run lint

      - name: اختبارات منطق الأعمال
        run: npm test

      # البناء يحتاج متغيرات وهمية فقط — لا يتصل بقاعدة بيانات حقيقية
      - name: البناء
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: ci-placeholder-secret-value-not-real
          COMPANY_VAT_NUMBER: "310007971600003"
          DRIVE_ACCOUNTS_FOLDER_ID: placeholder
          DRIVE_YEAR_2026_FOLDER_ID: placeholder
          DRIVE_YEAR_2027_FOLDER_ID: placeholder
